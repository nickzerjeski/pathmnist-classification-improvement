[project]
name = "pathmnist-classification-improvement"
version = "0.1.0"
description = "Reproducible PathMNIST training, ensembling, and cluster-aware experiments."
requires-python = ">=3.11"
dependencies = [
  "matplotlib",
  "medmnist",
  "numpy",
  "pandas",
  "pillow",
  "scikit-learn",
  "timm",
  "torch",
  "torchvision",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

